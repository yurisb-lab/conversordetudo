<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de Tudo — PDF, imagem, vídeo e áudio direto no navegador</title>
<meta name="description" content="Junte, divida, comprima e converta PDF, imagens, vídeos, áudios e planilhas. Grátis, sem limites e sem enviar seus arquivos para nenhum servidor.">
<meta name="theme-color" content="#5046E5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235046E5'/%3E%3Cpath d='M20 24h18l-6-6M44 40H26l6 6' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============ TOKENS ============ */
:root{
  --c-bg:#F6F6FB; --c-surface:#FFFFFF; --c-surface-2:#F0F0F7; --c-surface-3:#E6E6F0;
  --c-border:#E1E1EC; --c-border-strong:#C9C9D9;
  --c-text:#16162A; --c-text-2:#4E4E66; --c-text-3:#64647C;
  --c-primary:#5046E5; --c-primary-hover:#3F36C8; --c-primary-soft:#ECEBFD; --c-on-primary:#FFFFFF;
  --c-success:#0F7A55; --c-success-soft:#E3F5EE; --c-danger:#C42B36; --c-danger-soft:#FCE9EA;
  --c-warning:#9A5200; --c-warning-soft:#FFF3E0;
  --c-overlay:rgba(18,18,40,.55); --c-redact:#000000; --c-white:#FFFFFF;
  --cat-pdf:#D93A44; --cat-conv:#D45A12; --cat-img:#B07400; --cat-video:#8137CC; --cat-audio:#0B8079; --cat-dados:#2569C9; --cat-arq:#4A5668;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:40px; --s-8:56px;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,20,50,.06),0 1px 3px rgba(20,20,50,.06);
  --sh-2:0 6px 24px rgba(20,20,50,.10);
  --sh-3:0 18px 50px rgba(20,20,50,.22);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:22px; --fs-2xl:30px; --fs-3xl:42px;
  --focus:0 0 0 3px var(--c-bg),0 0 0 5px var(--c-primary);
  --maxw:1200px; --header-h:64px;
  color-scheme:light;
}
[data-theme="dark"]{
  --c-bg:#0F0F1A; --c-surface:#181826; --c-surface-2:#212133; --c-surface-3:#2B2B40;
  --c-border:#2C2C42; --c-border-strong:#3E3E5A;
  --c-text:#EDEDF7; --c-text-2:#B9B9CF; --c-text-3:#9C9CB6;
  --c-primary:#8C85FF; --c-primary-hover:#A39DFF; --c-primary-soft:#26244A; --c-on-primary:#0F0F1A;
  --c-success:#4CD3A0; --c-success-soft:#123327; --c-danger:#FF7A83; --c-danger-soft:#3A1A1F;
  --c-warning:#FFB255; --c-warning-soft:#3A2A12;
  --cat-pdf:#E5545D; --cat-conv:#E26A24; --cat-img:#C68A0E; --cat-video:#9254DB; --cat-audio:#14958D; --cat-dados:#3A7DDB; --cat-arq:#5D6B80;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 24px rgba(0,0,0,.45); --sh-3:0 18px 50px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:var(--fs-md);line-height:1.5;color:var(--c-text);background:var(--c-bg);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--c-primary)}
img,canvas,video{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--s-3);top:-60px;background:var(--c-primary);color:var(--c-on-primary);padding:var(--s-2) var(--s-4);border-radius:var(--r-sm);z-index:100;text-decoration:none}
.skip:focus{top:var(--s-3)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--s-5)}
@media (max-width:640px){.wrap{padding:0 var(--s-4)}}
.muted{color:var(--c-text-2)}
.small{font-size:var(--fs-sm)}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ HEADER ============ */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--c-surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--c-border)}
.topbar .wrap{display:flex;align-items:center;gap:var(--s-4);height:var(--header-h)}
.brand{display:flex;align-items:center;gap:var(--s-2);text-decoration:none;color:var(--c-text);font-weight:800;font-size:var(--fs-lg);letter-spacing:-.02em;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--c-primary);display:grid;place-items:center;color:var(--c-on-primary)}
.brand-mark svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.brand b{color:var(--c-primary)}
.nav{display:flex;gap:var(--s-1);margin-left:var(--s-4)}
.nav a{padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);text-decoration:none;color:var(--c-text-2);font-weight:600;font-size:var(--fs-sm)}
.nav a:hover{background:var(--c-surface-2);color:var(--c-text)}
.nav a[aria-current="page"]{color:var(--c-primary);background:var(--c-primary-soft)}
.top-actions{margin-left:auto;display:flex;gap:var(--s-2);align-items:center}
.search-btn{display:flex;align-items:center;gap:var(--s-2);min-width:220px;padding:var(--s-2) var(--s-3);border:1px solid var(--c-border);border-radius:var(--r-full);background:var(--c-surface-2);color:var(--c-text-3);cursor:pointer;font-size:var(--fs-sm)}
.search-btn:hover{border-color:var(--c-border-strong)}
.search-btn kbd{margin-left:auto}
kbd{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border:1px solid var(--c-border-strong);border-bottom-width:2px;border-radius:5px;background:var(--c-surface);color:var(--c-text-2)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--r-full);background:transparent;color:var(--c-text-2);cursor:pointer}
.icon-btn:hover{background:var(--c-surface-2);color:var(--c-text)}
@media (max-width:900px){.nav{display:none}.search-btn{min-width:0}.search-btn span,.search-btn kbd{display:none}}

/* ============ BUTTONS / FORM ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:44px;padding:var(--s-2) var(--s-5);border-radius:var(--r-md);border:1px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-text);font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--c-surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--c-primary);border-color:var(--c-primary);color:var(--c-on-primary)}
.btn-primary:hover{background:var(--c-primary-hover);border-color:var(--c-primary-hover)}
.btn-lg{min-height:56px;font-size:var(--fs-lg);padding:var(--s-3) var(--s-6);border-radius:var(--r-lg)}
.btn-sm{min-height:34px;padding:var(--s-1) var(--s-3);font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-danger{color:var(--c-danger)}
.btn-block{width:100%}
.field{display:flex;flex-direction:column;gap:var(--s-1);margin-bottom:var(--s-4)}
.field>label,.field>.lbl{font-weight:650;font-size:var(--fs-sm)}
.field .hint{font-size:var(--fs-xs);color:var(--c-text-3)}
.input,select.input,textarea.input{width:100%;min-height:42px;padding:var(--s-2) var(--s-3);border:1px solid var(--c-border-strong);border-radius:var(--r-sm);background:var(--c-surface);color:var(--c-text)}
textarea.input{min-height:120px;font-family:var(--font-mono);font-size:var(--fs-sm);resize:vertical}
.input:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-soft)}
input[type="color"].input{padding:2px;height:42px;width:64px}
input[type="range"]{width:100%;accent-color:var(--c-primary)}
.check{display:flex;gap:var(--s-2);align-items:flex-start;font-size:var(--fs-sm);cursor:pointer;margin-bottom:var(--s-3)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--c-primary)}
.seg{display:flex;flex-wrap:wrap;gap:var(--s-1);padding:var(--s-1);background:var(--c-surface-2);border-radius:var(--r-md)}
.seg label{flex:1 1 auto;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:600;color:var(--c-text-2);white-space:nowrap}
.seg input:checked+span{background:var(--c-surface);color:var(--c-primary);box-shadow:var(--sh-1)}
.seg input:focus-visible+span{box-shadow:var(--focus)}
.range-row{display:flex;align-items:center;gap:var(--s-3)}
.range-row output{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:var(--fs-sm)}

/* ============ HOME ============ */
.hero{padding:var(--s-8) 0 var(--s-6);text-align:center}
.hero h1{font-size:var(--fs-3xl);line-height:1.1;letter-spacing:-.03em;margin:0 auto var(--s-3);max-width:820px}
.hero h1 em{font-style:normal;color:var(--c-primary)}
.hero p{font-size:var(--fs-lg);color:var(--c-text-2);max-width:680px;margin:0 auto var(--s-5)}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-2);margin-bottom:var(--s-6)}
.badge{display:inline-flex;align-items:center;gap:var(--s-2);padding:var(--s-1) var(--s-3);border-radius:var(--r-full);background:var(--c-surface);border:1px solid var(--c-border);font-size:var(--fs-sm);font-weight:600;color:var(--c-text-2)}
.badge svg{width:16px;height:16px;color:var(--c-success)}
.home-search{max-width:560px;margin:0 auto;position:relative}
.home-search svg{position:absolute;left:var(--s-4);top:50%;transform:translateY(-50%);color:var(--c-text-3)}
.home-search input{width:100%;height:54px;padding:0 var(--s-4) 0 48px;border-radius:var(--r-full);border:1px solid var(--c-border-strong);background:var(--c-surface);font-size:var(--fs-md);box-shadow:var(--sh-1)}
.home-search input:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 4px var(--c-primary-soft)}
@media (max-width:640px){.hero{padding:var(--s-6) 0 var(--s-4)}.hero h1{font-size:var(--fs-2xl)}.hero p{font-size:var(--fs-md)}}
.chips{display:flex;gap:var(--s-2);flex-wrap:wrap;justify-content:center;margin:var(--s-5) 0}
.chip{padding:var(--s-2) var(--s-4);border-radius:var(--r-full);border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-2);font-weight:650;font-size:var(--fs-sm);cursor:pointer}
.chip:hover{border-color:var(--c-border-strong);color:var(--c-text)}
.chip[aria-pressed="true"]{background:var(--c-text);border-color:var(--c-text);color:var(--c-bg)}
.sec-title{font-size:var(--fs-lg);margin:var(--s-6) 0 var(--s-3);display:flex;align-items:center;gap:var(--s-2)}
.sec-title small{font-weight:500;color:var(--c-text-3);font-size:var(--fs-sm)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s-3)}
.card{position:relative;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:var(--s-4);transition:transform .15s,box-shadow .15s,border-color .15s;min-height:150px;display:flex;flex-direction:column;gap:var(--s-2)}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--c-border-strong)}
.card a.stretch{color:var(--c-text);text-decoration:none;font-weight:750;font-size:var(--fs-md)}
.card a.stretch::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg)}
.card a.stretch:focus-visible{box-shadow:none}
.card:has(a.stretch:focus-visible){box-shadow:var(--focus)}
.card p{margin:0;font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.45}
.tool-ico{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--c-white);flex:none}
.tool-ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fav{position:absolute;top:var(--s-3);right:var(--s-3);z-index:2;width:36px;height:36px;border:0;border-radius:var(--r-full);background:transparent;color:var(--c-text-3);cursor:pointer;display:grid;place-items:center}
.fav:hover{background:var(--c-surface-2)}
.fav[aria-pressed="true"]{color:var(--c-warning)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.tag-new{position:absolute;top:var(--s-4);right:52px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-full);background:var(--c-success-soft);color:var(--c-success)}
.empty{text-align:center;padding:var(--s-8) var(--s-4);color:var(--c-text-2)}
.empty svg{width:48px;height:48px;color:var(--c-text-3);margin-bottom:var(--s-3)}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s-4);margin:var(--s-8) 0}
.feature{padding:var(--s-5);border-radius:var(--r-lg);background:var(--c-surface);border:1px solid var(--c-border)}
.feature h3{margin:var(--s-3) 0 var(--s-1);font-size:var(--fs-md)}
.feature p{margin:0;color:var(--c-text-2);font-size:var(--fs-sm)}
.feature .fi{width:40px;height:40px;border-radius:var(--r-md);background:var(--c-primary-soft);color:var(--c-primary);display:grid;place-items:center}

/* ============ TOOL PAGE ============ */
.crumbs{display:flex;gap:var(--s-2);align-items:center;font-size:var(--fs-sm);color:var(--c-text-3);padding-top:var(--s-5)}
.crumbs a{color:var(--c-text-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.tool-head{display:flex;gap:var(--s-4);align-items:center;margin:var(--s-4) 0 var(--s-5)}
.tool-head .tool-ico{width:56px;height:56px;border-radius:var(--r-lg)}
.tool-head .tool-ico svg{width:30px;height:30px}
.tool-head h1{margin:0;font-size:var(--fs-2xl);letter-spacing:-.02em;line-height:1.15}
.tool-head p{margin:var(--s-1) 0 0;color:var(--c-text-2)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s-3);padding:var(--s-8) var(--s-5);border:2px dashed var(--c-border-strong);border-radius:var(--r-xl);background:var(--c-surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--c-primary);background:var(--c-primary-soft)}
.drop .big-ico{width:72px;height:72px;border-radius:var(--r-xl);display:grid;place-items:center;color:var(--c-white)}
.drop .big-ico svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop h2{margin:0;font-size:var(--fs-xl)}
.drop .formats{font-size:var(--fs-xs);color:var(--c-text-3);max-width:520px}
.drop-actions{display:flex;gap:var(--s-2);flex-wrap:wrap;justify-content:center}
body.dragging::after{content:"Solte os arquivos aqui";position:fixed;inset:var(--s-3);border:3px dashed var(--c-primary);border-radius:var(--r-xl);background:color-mix(in srgb,var(--c-primary-soft) 85%,transparent);display:grid;place-items:center;font-size:var(--fs-2xl);font-weight:800;color:var(--c-primary);z-index:90;pointer-events:none}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s-5);align-items:start;padding-bottom:var(--s-8)}
@media (max-width:900px){.workspace{grid-template-columns:1fr}}
.panel{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:var(--s-5)}
.side{position:sticky;top:calc(var(--header-h) + var(--s-4))}
@media (max-width:900px){.side{position:static}}
.side h2{font-size:var(--fs-lg);margin:0 0 var(--s-4)}
.run-bar{margin-top:var(--s-2)}
@media (max-width:900px){.run-bar{position:sticky;bottom:0;background:var(--c-surface);padding:var(--s-3) 0;margin:0 calc(-1 * var(--s-5)) calc(-1 * var(--s-5));padding:var(--s-3) var(--s-5);border-top:1px solid var(--c-border);border-radius:0 0 var(--r-lg) var(--r-lg)}}
.files-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);margin-bottom:var(--s-3);flex-wrap:wrap}
.files-head h2{margin:0;font-size:var(--fs-lg)}
.files{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--s-3)}
.file{position:relative;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s-2);display:flex;flex-direction:column;gap:var(--s-2);cursor:grab}
.file.drag-over{border-color:var(--c-primary);box-shadow:0 0 0 2px var(--c-primary)}
.file.dragging{opacity:.4}
.thumb{aspect-ratio:3/4;border-radius:var(--r-sm);background:var(--c-surface-2);display:grid;place-items:center;overflow:hidden;color:var(--c-text-3)}
.thumb img,.thumb canvas{width:100%;height:100%;object-fit:contain;background:var(--c-white)}
.thumb svg{width:40px;height:40px}
.thumb .ext{font-weight:800;font-size:var(--fs-sm);letter-spacing:.05em;text-transform:uppercase;margin-top:var(--s-1)}
.file .fname{font-size:var(--fs-sm);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fmeta{font-size:var(--fs-xs);color:var(--c-text-3)}
.file .ftools{display:flex;gap:2px;justify-content:flex-end}
.file .ftools button{width:30px;height:30px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--c-text-2);cursor:pointer;display:grid;place-items:center}
.file .ftools button:hover{background:var(--c-surface-2);color:var(--c-text)}
.file .ftools button svg{width:16px;height:16px}
.file .num{position:absolute;top:var(--s-3);left:var(--s-3);min-width:24px;height:24px;padding:0 6px;border-radius:var(--r-full);background:var(--c-text);color:var(--c-bg);font-size:var(--fs-xs);font-weight:800;display:grid;place-items:center}
.add-more{border:2px dashed var(--c-border-strong);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-2);min-height:200px;color:var(--c-text-2);background:transparent;cursor:pointer;font-weight:650}
.add-more:hover{border-color:var(--c-primary);color:var(--c-primary)}
.note{display:flex;gap:var(--s-2);padding:var(--s-3);border-radius:var(--r-md);background:var(--c-surface-2);font-size:var(--fs-sm);color:var(--c-text-2);margin-bottom:var(--s-4)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}
.note.warn{background:var(--c-warning-soft);color:var(--c-warning)}
.note.ok{background:var(--c-success-soft);color:var(--c-success)}
.note.err{background:var(--c-danger-soft);color:var(--c-danger)}

/* progress */
.working{text-align:center;padding:var(--s-8) var(--s-5)}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid var(--c-surface-3);border-top-color:var(--c-primary);animation:spin 1s linear infinite;margin:0 auto var(--s-4)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.bar{height:10px;border-radius:var(--r-full);background:var(--c-surface-3);overflow:hidden;max-width:480px;margin:var(--s-4) auto var(--s-2)}
.bar>i{display:block;height:100%;width:0;background:var(--c-primary);border-radius:var(--r-full);transition:width .2s}

.item .h-del{right:-13px;top:-13px;background:var(--c-danger);color:var(--c-white)}

.rect .h-del svg{width:12px;height:12px}

.org-page.drag-over{border-color:var(--c-primary);box-shadow:0 0 0 2px var(--c-primary)}
.org-page.dragging{opacity:.4}
.org-page .src{position:absolute;top:var(--s-3);left:var(--s-3);width:12px;height:12px;border-radius:50%;z-index:1;border:2px solid var(--c-white)}
.blank-thumb{width:100%;height:100%;background:var(--c-white)}

.pal-list small{display:block;color:var(--c-text-3);font-size:var(--fs-xs)}
.dlg-body{padding:var(--s-5)}

.dlg-actions{display:flex;justify-content:flex-end;gap:var(--s-2);margin-top:var(--s-4)}

.toast{background:var(--c-text);color:var(--c-bg);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);box-shadow:var(--sh-3);font-size:var(--fs-sm);display:flex;gap:var(--s-2);align-items:flex-start;animation:pop .2s ease-out}

footer.foot{margin-top:auto;border-top:1px solid var(--c-border);padding:var(--s-5) 0;color:var(--c-text-3);font-size:var(--fs-sm)}

const libPromises = {};
function loadLib(name) {
  const L = LIBS[name];
  if (L.ok()) return Promise.resolve();
  if (!libPromises[name]) libPromises[name] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = L.src; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => { try { L.after && L.after(); res(); } catch (e) { rej(e); } };
    s.onerror = () => { delete libPromises[name]; s.remove(); rej(new Error('Não foi possível baixar um componente necessário. Verifique sua conexão e tente de novo (só é preciso internet na primeira vez).')); };
    document.head.appendChild(s);
  });
  return libPromises[name];
}
const libs = (...names) => Promise.all(names.map(loadLib));

const db = {
  _k: k => 'cdt:' + k,
  ler(k, padrao) { try { const v = localStorage.getItem(this._k(k)); return v == null ? padrao : JSON.parse(v); } catch { return padrao; } },
  gravar(k, v) { try { localStorage.setItem(this._k(k), JSON.stringify(v)); return true; } catch { return false; } },
  listar(colecao) { return this.ler(colecao, []); },
  salvar(colecao, item, limite = 200) {
    const l = this.listar(colecao); item.id = item.id || uid(); l.unshift(item);
    while (!this.gravar(colecao, l.slice(0, limite)) && l.length > 1) l.splice(Math.floor(l.length / 2));
    return item;
  },
  remover(colecao, id) { this.gravar(colecao, this.listar(colecao).filter(i => i.id !== id)); },
  limpar(colecao) { localStorage.removeItem(this._k(colecao)); }
};

const TOOLS = [];

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function searchTools(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return TOOLS;
  return TOOLS.map(t => {
    const hay = norm([t.name, t.desc, t.keys || '', (t.accept || []).join(' '), CATS.find(c => c.id === t.cat).name].join(' '));
    let score = 0;
    for (const w of words) { if (!hay.includes(w)) return null; score += norm(t.name).includes(w) ? 3 : 1; }
    return { t, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score).map(x => x.t);
}
function acceptList(t) { return (t.accept || []).flatMap(k => EXT[k] || [k]); }
function acceptsFile(t, name) { const l = acceptList(t); return !l.length || l.includes(extOf(name)); }

/* ---------- executar ---------- */
async function runTool() {

  if (t.validate) { const msg = t.validate(S.opts, S.files); if (msg) { toast(msg, 'err'); return; } }

    S.stage = 'done';

      ts: Date.now(), tool: t.id, ms: Math.round(performance.now() - t0),

}

tool({

        const size = +o.size, m = +o.margin;

/* escreve texto "de pé" mesmo em páginas giradas; (ux,uy) = posição vista na tela, a partir do canto inferior esquerdo */
function drawUpright(page, text, ux, uy, opts) {
  const rot = ((page.getRotation().angle % 360) + 360) % 360;
  const { width: W, height: H, x: bx, y: by } = page.getCropBox();
  let px = ux, py = uy;
  if (rot === 90) { px = W - uy; py = ux; } else if (rot === 180) { px = W - ux; py = H - uy; } else if (rot === 270) { px = uy; py = H - ux; }
  page.drawText(text, { x: bx + px, y: by + py, rotate: PDFLib.degrees(rot), ...opts });
}
function visualSize(page) { const r = page.getRotation().angle % 180; const { width, height } = page.getCropBox(); return r ? [height, width] : [width, height]; }

  validate: o => (o.type === 'image' && !(o.img instanceof Blob)) ? 'Escolha a imagem da marca d\'água.' : (o.type === 'text' && !String(o.text).trim()) ? 'Digite o texto da marca d\'água.' : '',
  async run(files, o, ctx) {

      const d = await loadPdf(f);
      const font = await d.embedFont(PDFLib.StandardFonts.HelveticaBold);
      const img = o.type === 'image' ? await embedImageBlob(d, o.img) : null;
      const text = o.type === 'text' ? safeText(font, o.text) : '';
      const op = +o.opacity / 100, ang = +o.angle, rad = ang * Math.PI / 180;
      for (const i of pickPages(o, d.getPageCount())) {

        let w, h;

        const stamp = (cx, cy) => { // centro (cx,cy) -> canto inferior esquerdo rotacionado
          const x = cx - (w / 2) * Math.cos(rad) + (h / 2) * Math.sin(rad);

tool({
  id: 'pdf-para-word', cat: 'conv', icon: 'word', name: 'PDF para Word', action: 'Converter para Word',
  desc: 'Gere um .docx editável a partir do texto do PDF, ou uma cópia fiel do visual.',
  keys: 'docx word doc editavel converter', accept: ['pdf'], dropLabel: 'PDFs',
  note: 'PDFs escaneados (foto) não têm texto: use antes o <a href="#/f/ocr-pdf">OCR</a> ou escolha "Visual idêntico".',
  options: [{ id: 'mode', label: 'Modo', type: 'select', def: 'text', choices: [{ v: 'text', l: 'Texto editável (parágrafos e títulos)' }, { v: 'image', l: 'Visual idêntico (páginas como imagem)' }] }],
  async run(files, o, ctx) {
    await libs('docx', 'pdfjs');
    return eachPdf(files, ctx, async f => {
      const doc = await openPdfjs(f); const D = docx; const sections = []; let anyText = false;
      if (o.mode === 'image') {
        for (let i = 1; i <= doc.numPages; i++) {
          ctx.progress((i - 1) / doc.numPages, `Página ${i} de ${doc.numPages}`);
          const page = await doc.getPage(i); const vp = page.getViewport({ scale: 1 });
          const cv = await renderPdfPage(doc, i, 0, { scale: 2 });
          const data = await (await canvasToBlob(cv, 'image/jpeg', 0.88)).arrayBuffer();
          sections.push({ properties: { page: { size: { width: Math.round(vp.width * 20), height: Math.round(vp.height * 20) }, margin: { top: 0, bottom: 0, left: 0, right: 0, header: 0, footer: 0 } } },
            children: [new D.Paragraph({ children: [new D.ImageRun({ data, transformation: { width: Math.round(vp.width * 96 / 72) - 1, height: Math.round(vp.height * 96 / 72) - 2 } })] })] });
        }
      } else {
        const children = [];
        for (let i = 1; i <= doc.numPages; i++) {
          ctx.progress((i - 1) / doc.numPages, `Lendo página ${i} de ${doc.numPages}`);
          const { lines } = await pageLines(await doc.getPage(i));
          if (!lines.length) continue; anyText = true;
          const sizes = lines.map(l => l.size).sort((a, b) => a - b); const body = sizes[Math.floor(sizes.length / 2)] || 11;
          let para = null, prev = null;
          const flush = () => { if (para) children.push(new D.Paragraph({ children: [new D.TextRun({ text: para.text, bold: para.bold, size: Math.round(clamp(para.size, 7, 40) * 2) })], heading: para.size > body * 1.5 ? D.HeadingLevel.HEADING_1 : para.size > body * 1.2 ? D.HeadingLevel.HEADING_2 : undefined, spacing: { after: 140 }, pageBreakBefore: para.pb })); para = null; };
          lines.forEach((l, k) => {
            const gap = prev ? l.y - prev.y : 0;
            const newPara = !para || gap > l.size * 1.75 || Math.abs(l.size - para.size) > 1 || l.bold !== para.bold || /^[•\-–·▪●\d]+[.)]?\s/.test(l.text);
            if (newPara) { flush(); para = { text: l.text.replace(/\t/g, '    '), size: l.size, bold: l.bold, pb: k === 0 && i > 1 }; }
            else para.text = para.text.endsWith('-') ? para.text.slice(0, -1) + l.text : para.text + ' ' + l.text;
            prev = l;
          });
          flush();
        }
        if (!anyText) throw new UserError('Não encontramos texto neste PDF — ele parece ser escaneado.', 'Rode o <a href="#/f/ocr-pdf">OCR</a> antes, ou escolha o modo "Visual idêntico".');
        sections.push({ children });
      }
      doc.destroy();
      const blob = await D.Packer.toBlob(new D.Document({ creator: 'Conversor de Tudo', sections }));
      return { name: outName(f, '', 'docx').replace(/-\.docx$/, '.docx'), blob };
    }, 'Convertendo');
  }
});

    return eachPdf(files, ctx, async f => {

      for (let i = 1; i <= doc.numPages; i++) {

      const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      return { name: outName(f, '', 'xlsx').replace(/-\.xlsx$/, '.xlsx'), blob: new Blob([buf], { type: mimeOf('xlsx') }) };
    }, 'Convertendo');

    const out = [];

      const [W, H] = PAGE_SIZES[o.page]; const m = 56, size = +o.size, lh = size * 1.4, maxW = W - m * 2;

        }
        emit(line);
      }

  id: 'comparar-pdf', cat: 'pdf', icon: 'compare', name: 'Comparar PDFs', action: 'Comparar',

  keys: 'diferenca diff comparar versao mudancas', accept: ['pdf'], minFiles: 2, ordered: true, dropLabel: '2 PDFs',

function diffLines(a, b) { // LCS por linhas (limitado para não travar)

  const cx = cv.getContext('2d'); const { width: w, height: h } = cv; const d = cx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < x0) return null;
  const p = 6; x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p); x1 = Math.min(w - 1, x1 + p); y1 = Math.min(h - 1, y1 + p);

EDITORS.rects = {
  async mount(el, t) {
    el.innerHTML = `<div class="working"><div class="spinner"></div><p class="muted">Abrindo o PDF…</p></div>`;
    let E; try { E = await ensurePdfView('rects'); } catch (e) { el.innerHTML = `<div class="note err">${svg('info')}<span>${esc(e.message)} ${e.hint || ''}</span></div>`; return; }

    const root = mountPages(el, E, '');
    if (t.sidebar) t.sidebar($('#custom-side'));
    $('#ed-hint', el).textContent = t.placeHint;
    const draw = () => {
      $$('.ov', root).forEach(o => o.innerHTML = '');
      for (const r of E.rects) {
        const ov = $(`[data-ov="${r.page}"]`, root); if (!ov) continue;
        const d = document.createElement('div'); d.className = 'rect' + (single ? ' crop' : ''); d.dataset.r = r.id;
        Object.assign(d.style, { left: r.x * 100 + '%', top: r.y * 100 + '%', width: r.w * 100 + '%', height: r.h * 100 + '%' });
        d.innerHTML = `<button type="button" class="h-del" aria-label="Remover área">${svg('x')}</button>`;
        ov.appendChild(d);
      }
      const c = $('#rect-count'); if (c) c.textContent = E.rects.length;
    };
    E.redraw = draw; draw();
    let st = null;
    root.onpointerdown = e => {
      const ov = e.target.closest('.ov'); if (!ov) return;
      if (e.target.closest('.h-del')) { const id = e.target.closest('.rect').dataset.r; E.rects = E.rects.filter(r => r.id !== id); draw(); return; }
      e.preventDefault(); ov.setPointerCapture(e.pointerId);
      const { fx, fy } = ovPoint(ov, e);
      const tmp = document.createElement('div'); tmp.className = 'rect' + (single ? ' crop' : ''); ov.appendChild(tmp);
      st = { ov, page: +ov.dataset.ov, x0: clamp(fx, 0, 1), y0: clamp(fy, 0, 1), tmp };
    };
    root.onpointermove = e => {
      if (!st) return; const { fx, fy } = ovPoint(st.ov, e);
      const x1 = clamp(fx, 0, 1), y1 = clamp(fy, 0, 1);
      st.r = { x: Math.min(st.x0, x1), y: Math.min(st.y0, y1), w: Math.abs(x1 - st.x0), h: Math.abs(y1 - st.y0) };
      Object.assign(st.tmp.style, { left: st.r.x * 100 + '%', top: st.r.y * 100 + '%', width: st.r.w * 100 + '%', height: st.r.h * 100 + '%' });
    };
    root.onpointerup = () => {
      if (!st) return; const r = st.r; st.tmp.remove();
      if (r && r.w > 0.008 && r.h > 0.004) { if (single) E.rects = []; E.rects.push({ id: uid(), page: st.page, ...r }); }
      st = null; draw();
    };
  }
};

  build(o) { return { ext: o.fmt, suffix: 'volume', args: n => ['-i', n[0], '-vn', '-af', o.mode === 'norm' ? 'loudnorm=I=-16:TP=-1.5:LRA=11' : `volume=${o.db}dB`, ...ACODEC[o.fmt](192)] }; }
});
mediaTool({
  id: 'velocidade-audio', cat: 'audio', icon: 'speed', name: 'Velocidade do áudio', action: 'Aplicar', verb: 'Ajustando', extra: true,
  desc: 'Acelere aulas e podcasts sem voz de esquilo, ou deixe mais devagar.',
  keys: 'velocidade acelerar podcast aula audio lento rapido', accept: ['audio'], dropLabel: 'áudios',
  options: [{ id: 's', label: 'Velocidade', type: 'select', def: '1.5', choices: [{ v: '0.5', l: '0,5×' }, { v: '0.75', l: '0,75×' }, { v: '1.25', l: '1,25×' }, { v: '1.5', l: '1,5×' }, { v: '1.75', l: '1,75×' }, { v: '2', l: '2×' }, { v: '3', l: '3×' }] }],
  build(o) { return { ext: 'mp3', suffix: o.s + 'x', args: n => ['-i', n[0], '-vn', '-af', atempo(+o.s), '-c:a', 'libmp3lame', '-b:a', '160k'] }; }
});
tool({
  id: 'juntar-audio', cat: 'audio', icon: 'merge', name: 'Juntar áudios', action: 'Juntar', ordered: true, minFiles: 2, note: MEDIA_NOTE,
  desc: 'Una várias músicas ou gravações em um único arquivo, na ordem que quiser.',
  keys: 'unir combinar mesclar concatenar musicas audios', accept: ['audio'], dropLabel: 'áudios',
  options: [{ id: 'fmt', label: 'Formato', type: 'select', def: 'mp3', choices: AFMT }, bitrateOpt, { id: 'name', label: 'Nome do arquivo', type: 'text', def: 'audios-unidos' }],
  async run(files, o, ctx) {
    const blob = await ffRun(ctx, files, n => [...n.flatMap(x => ['-i', x]), '-filter_complex', n.map((_, i) => `[${i}:a]aresample=44100,aformat=channel_layouts=stereo[a${i}]`).join(';') + ';' + n.map((_, i) => `[a${i}]`).join('') + `concat=n=${n.length}:v=0:a=1[out]`, '-map', '[out]', ...ACODEC[o.fmt](o.br)], 'out.' + o.fmt, mimeOf(o.fmt), 'Juntando ' + files.length + ' áudios');
    return [{ name: (o.name || 'audios-unidos') + '.' + o.fmt, blob }];

});

/* =================== PLANILHAS, TEXTO E ZIP =================== */
tool({
  id: 'converter-planilha', cat: 'dados', icon: 'sheet', name: 'Converter planilha', action: 'Converter',
  desc: 'Excel, CSV, ODS, JSON: converta entre formatos de planilha em segundos.',
  keys: 'xlsx xls csv ods json tabela excel planilha converter', accept: ['sheet'], dropLabel: 'planilhas', zipName: 'planilhas',
  options: [
    { id: 'fmt', label: 'Converter para', type: 'select', def: 'xlsx', choices: [{ v: 'xlsx', l: 'Excel (.xlsx)' }, { v: 'csv', l: 'CSV' }, { v: 'json', l: 'JSON' }, { v: 'ods', l: 'OpenDocument (.ods)' }, { v: 'html', l: 'Tabela HTML' }] },
    { id: 'sep', label: 'Separador do CSV', type: 'seg', def: ';', choices: [{ v: ';', l: 'Ponto e vírgula (Excel BR)' }, { v: ',', l: 'Vírgula' }, { v: '\t', l: 'Tab' }], showIf: o => o.fmt === 'csv' }
  ],
  async run(files, o, ctx) {
    await libs('xlsx');
    const out = [];
    for (const f of files) {
      ctx.progress(null, 'Lendo ' + f.name);
      let wb;
      if (extOf(f.name) === 'json') { let data = JSON.parse(await f.file.text()); if (!Array.isArray(data)) data = Array.isArray(Object.values(data)[0]) ? Object.values(data)[0] : [data]; wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), 'Dados'); }
      else if (['csv', 'tsv'].includes(extOf(f.name))) { const txt = await f.file.text(); const first = txt.split('\n')[0]; const FS = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : first.includes('\t') ? '\t' : ','; wb = XLSX.read(txt, { type: 'string', FS }); }
      else wb = XLSX.read(await f.file.arrayBuffer(), { type: 'array' });
      const multi = wb.SheetNames.length > 1;
      if (['xlsx', 'ods'].includes(o.fmt)) { out.push({ name: outName(f, '', o.fmt).replace(/-\.(\w+)$/, '.$1'), blob: new Blob([XLSX.write(wb, { type: 'array', bookType: o.fmt })], { type: mimeOf(o.fmt) }) }); continue; }
      for (const sn of wb.SheetNames) {
        const ws = wb.Sheets[sn]; const nm = multi ? outName(f, sn.replace(/[^\w\- ]/g, ''), o.fmt) : outName(f, '', o.fmt).replace(/-\.(\w+)$/, '.$1');
        let content, type;
        if (o.fmt === 'csv') { content = '﻿' + XLSX.utils.sheet_to_csv(ws, { FS: o.sep }); type = 'text/csv;charset=utf-8'; }
        else if (o.fmt === 'json') { content = JSON.stringify(XLSX.utils.sheet_to_json(ws, { defval: '' }), null, 2); type = 'application/json'; }
        else { content = XLSX.utils.sheet_to_html(ws); type = 'text/html'; }
        out.push({ name: nm, blob: new Blob([content], { type }) });
      }
    }
    return out;
  }
});
tool({
  id: 'compactar-zip', cat: 'dados', icon: 'zip', name: 'Compactar em ZIP', action: 'Criar ZIP',
  desc: 'Junte qualquer tipo de arquivo em um .zip para enviar tudo de uma vez.',
  keys: 'zip compactar zipar agrupar arquivos enviar', accept: [], dropLabel: 'arquivos',
  options: [{ id: 'name', label: 'Nome do ZIP', type: 'text', def: 'arquivos' }, { id: 'level', label: 'Compressão', type: 'seg', def: '6', choices: [{ v: '0', l: 'Nenhuma (rápido)' }, { v: '6', l: 'Normal' }, { v: '9', l: 'Máxima' }] }],
  async run(files, o, ctx) {
    await libs('jszip'); const z = new JSZip(); const used = new Set();
    files.forEach(f => z.file(uniqueName(f.name, used), f.file));
    const blob = await z.generateAsync({ type: 'blob', compression: +o.level ? 'DEFLATE' : 'STORE', compressionOptions: { level: +o.level || 1 } }, m => setProgress(m.percent / 100, 'Compactando'));
    return [{ name: (o.name || 'arquivos') + '.zip', blob, note: files.length + ' arquivo(s)' }];
  }
});
tool({
  id: 'extrair-zip', cat: 'dados', icon: 'unzip', name: 'Extrair ZIP', action: 'Extrair arquivos',
  desc: 'Abra arquivos .zip e baixe só o que precisa, sem instalar nada.',
  keys: 'unzip descompactar abrir zip extrair', accept: ['zip'], dropLabel: 'arquivos ZIP',
  async run(files, o, ctx) {
    await libs('jszip'); const out = [];
    for (const f of files) {
      let z; try { z = await JSZip.loadAsync(f.file); } catch { throw new UserError(`"${f.name}" não é um ZIP válido ou está protegido por senha.`); }
      const entries = Object.values(z.files).filter(e => !e.dir && !/(^|\/)(__MACOSX|\.DS_Store)/.test(e.name));
      for (let i = 0; i < entries.length; i++) { ctx.progress(i / entries.length, 'Extraindo ' + entries[i].name); const b = await entries[i].async('blob'); const nm = entries[i].name.split('/').pop(); out.push({ name: nm, blob: new Blob([b], { type: mimeOf(extOf(nm)) }), note: entries[i].name.includes('/') ? entries[i].name.replace(/\/[^/]*$/, '') : '' }); }
    }
    if (!out.length) throw new UserError('O ZIP está vazio.');
    return out;
  }
});
